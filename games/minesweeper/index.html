<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>扫雷</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1115;color:#e7e9ee;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;overscroll-behavior:none}
.wrap{max-width:520px;margin:0 auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.levels{display:flex;gap:6px}
.levels button{background:#1a1f2b;border:1px solid #232a38;color:#9aa4b8;border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer}
.levels button.on{background:#2f6fe4;border-color:#2f6fe4;color:#fff;font-weight:600}
.newbtn{background:#2a3346;border:1px solid #38445c;color:#e7e9ee;border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer}
.meta{display:flex;align-items:center;gap:16px;font-size:13px;color:#8b93a7;margin-bottom:10px;font-variant-numeric:tabular-nums}
.meta b{color:#cfd6e4}
.grid{display:grid;gap:2px;background:#0f1115;border-radius:10px;user-select:none;touch-action:manipulation}
.cell{display:flex;align-items:center;justify-content:center;background:#2a3346;border-radius:4px;font-weight:700;cursor:pointer;transition:background .08s;line-height:1}
.cell:active{background:#3a4763}
.cell.open{background:#151a24;cursor:default}
.cell.open:active{background:#151a24}
.cell.flag{background:#3a2f1e}
.cell.mine{background:#7a1f1f}
.cell.boom{background:#e0452e}
.cell[data-n="1"]{color:#4a9eff}.cell[data-n="2"]{color:#3ecf6a}.cell[data-n="3"]{color:#ff6b6b}
.cell[data-n="4"]{color:#b388ff}.cell[data-n="5"]{color:#ffb74a}.cell[data-n="6"]{color:#4dd0e1}
.cell[data-n="7"]{color:#e0e0e0}.cell[data-n="8"]{color:#9e9e9e}
.banner{margin-top:12px;text-align:center;font-size:15px;font-weight:600;min-height:22px}
.banner.win{color:#3ecf6a}.banner.lose{color:#ff6b6b}
.tip{font-size:12px;color:#6f7b92;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="levels">
      <button data-lv="easy" class="on">简单</button>
      <button data-lv="mid">中等</button>
      <button data-lv="hard">困难</button>
    </div>
    <button class="newbtn" id="newBtn">重开</button>
  </div>
  <div class="meta">
    <span>💣 <b id="left">0</b></span>
    <span>⏱ <b id="time">0</b></span>
    <span>🙂 <b id="face">准备</b></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="banner" id="banner"></div>
  <div class="tip">点一下翻开 · 长按（或右键）插旗</div>
</div>
<script>
(function(){
  var LEVELS={easy:{r:8,c:8,m:10},mid:{r:12,c:12,m:22},hard:{r:16,c:16,m:40}};
  var gridEl=document.getElementById('grid'), leftEl=document.getElementById('left'), timeEl=document.getElementById('time'), faceEl=document.getElementById('face'), banner=document.getElementById('banner');
  var level='easy', R,C,M, board, started=false, over=false, flags=0, openCount=0, seconds=0, timerId=null;

  function newGame(){
    var L=LEVELS[level]; R=L.r; C=L.c; M=L.m;
    board=[];
    for(var r=0;r<R;r++){ var row=[]; for(var c=0;c<C;c++) row.push({mine:false,open:false,flag:false,adj:0}); board.push(row); }
    started=false; over=false; flags=0; openCount=0; seconds=0;
    clearInterval(timerId); timerId=null;
    timeEl.textContent='0'; faceEl.textContent='准备'; banner.textContent=''; banner.className='banner';
    updateLeft();
    render();
  }

  function placeMines(sr,sc){
    var cells=[];
    for(var r=0;r<R;r++)for(var c=0;c<C;c++){
      if(Math.abs(r-sr)<=1 && Math.abs(c-sc)<=1) continue;
      cells.push([r,c]);
    }
    for(var i=cells.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=cells[i];cells[i]=cells[j];cells[j]=t; }
    for(var k=0;k<M && k<cells.length;k++){ board[cells[k][0]][cells[k][1]].mine=true; }
    for(var r2=0;r2<R;r2++)for(var c2=0;c2<C;c2++){
      if(board[r2][c2].mine) continue;
      var n=0;
      for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0) continue;
        var rr=r2+dr, cc=c2+dc;
        if(rr>=0&&rr<R&&cc>=0&&cc<C&&board[rr][cc].mine) n++;
      }
      board[r2][c2].adj=n;
    }
  }

  function updateLeft(){ leftEl.textContent=Math.max(0,M-flags); }

  function cellSize(){
    var W=Math.min(window.innerWidth-24, 520);
    var size=Math.floor((W-(C-1)*2)/C);
    return Math.max(16, Math.min(size, 40));
  }

  function render(){
    var sz=cellSize();
    var fs=Math.max(10, Math.floor(sz*0.62));
    var html='';
    gridEl.style.gridTemplateColumns='repeat('+C+','+sz+'px)';
    for(var r=0;r<R;r++)for(var c=0;c<C;c++){
      var b=board[r][c], cls='cell', txt='';
      if(b.open){
        cls+=' open';
        if(b.mine){ cls+=' mine'; txt='💣'; }
        else if(b.adj){ cls+=' n'; txt=b.adj; }
      } else if(b.flag){ cls+=' flag'; txt='🚩'; }
      html+='<div class="'+cls+'" style="width:'+sz+'px;height:'+sz+'px;font-size:'+fs+'px" data-r="'+r+'" data-c="'+c+'" data-n="'+(b.open&&!b.mine?b.adj:0)+'">'+txt+'</div>';
    }
    gridEl.innerHTML=html;
  }

  function start(){
    if(started) return;
    started=true;
    timerId=setInterval(function(){ seconds++; timeEl.textContent=seconds; },1000);
    faceEl.textContent='进行中';
  }

  function reveal(r,c){
    if(over) return;
    var b=board[r][c];
    if(!b || b.open || b.flag) return;
    if(!started){ placeMines(r,c); start(); }
    if(b.mine){ lose(r,c); return; }
    // BFS
    var stack=[[r,c]];
    while(stack.length){
      var p=stack.pop(), rr=p[0], cc=p[1], cur=board[rr][cc];
      if(cur.open||cur.flag||cur.mine) continue;
      cur.open=true; openCount++;
      if(cur.adj===0){
        for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
          if(dr===0&&dc===0) continue;
          var nr=rr+dr, nc=cc+dc;
          if(nr>=0&&nr<R&&nc>=0&&nc<C&&!board[nr][nc].open&&!board[nr][nc].flag&&!board[nr][nc].mine) stack.push([nr,nc]);
        }
      }
    }
    render();
    checkWin();
  }

  function toggleFlag(r,c){
    if(over) return;
    var b=board[r][c];
    if(!b||b.open) return;
    if(!b.flag && flags>=M) return;
    b.flag=!b.flag;
    flags+=b.flag?1:-1;
    updateLeft(); render();
  }

  function lose(br,bc){
    over=true; clearInterval(timerId);
    for(var r=0;r<R;r++)for(var c=0;c<C;c++) if(board[r][c].mine) board[r][c].open=true;
    render();
    var el=gridEl.querySelector('[data-r="'+br+'"][data-c="'+bc+'"]');
    if(el) el.classList.add('boom');
    banner.textContent='踩雷了，再来一次吧'; banner.className='banner lose';
    faceEl.textContent='💥';
  }

  function checkWin(){
    if(openCount===R*C-M){
      over=true; clearInterval(timerId);
      banner.textContent='全部安全！用时 '+seconds+' 秒'; banner.className='banner win';
      faceEl.textContent='🎉';
    }
  }

  var pressTimer=null, longPressed=false;

  gridEl.addEventListener('touchstart', function(e){
    var el=e.target.closest('.cell'); if(!el) return;
    var r=+el.dataset.r, c=+el.dataset.c;
    longPressed=false;
    pressTimer=setTimeout(function(){ longPressed=true; toggleFlag(r,c); if(navigator.vibrate) navigator.vibrate(15); }, 380);
  }, {passive:true});

  gridEl.addEventListener('touchend', function(e){
    clearTimeout(pressTimer);
    if(longPressed){ e.preventDefault(); setTimeout(function(){longPressed=false;},50); }
  });
  gridEl.addEventListener('touchmove', function(){ clearTimeout(pressTimer); }, {passive:true});

  gridEl.addEventListener('click', function(e){
    if(longPressed){ longPressed=false; return; }
    var el=e.target.closest('.cell'); if(!el) return;
    reveal(+el.dataset.r, +el.dataset.c);
  });

  gridEl.addEventListener('contextmenu', function(e){
    e.preventDefault();
    var el=e.target.closest('.cell'); if(!el) return;
    toggleFlag(+el.dataset.r, +el.dataset.c);
  });

  document.querySelectorAll('.levels button').forEach(function(b){
    b.onclick=function(){
      level=b.dataset.lv;
      document.querySelectorAll('.levels button').forEach(function(x){x.classList.toggle('on',x===b);});
      newGame();
    };
  });
  document.getElementById('newBtn').onclick=newGame;
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(render,150); });

  newGame();
})();
</script>
</body>
</html>
